name: KSBench
options:
  bundleIdPrefix: de.superuser404
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: "$(ARCHS_STANDARD)"
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer
    exactVersion: 2.3.4
targets:
  KSBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/KSPlayerBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_KSPLAYER
    dependencies:
      - package: KSPlayer
  KSBenchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/KSBenchTests
      - path: Sources/Shared
      - path: Sources/Backends/KSPlayerBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_KSPLAYER
    dependencies:
      - package: KSPlayer
schemes:
  KSBench:
    build:
      targets:
        KSBench: all
        KSBenchTests: [test]
    test:
      targets:
        - KSBenchTests
