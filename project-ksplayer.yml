name: KSBench
options:
  bundleIdPrefix: de.superuser404
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: "$(ARCHS_STANDARD)"
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer
    exactVersion: 2.3.4
targets:
  KSBench:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/KSPlayerBackend.swift
    info:
      path: Sources/Shared/Info.plist
      properties:
        CFBundleDisplayName: KSBench
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_KSPLAYER
    dependencies:
      - package: KSPlayer
schemes:
  KSBench:
    build:
      targets:
        KSBench: all
