name: AetherBench
options:
  bundleIdPrefix: de.superuser404
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    revision: 73354ec8c6d20ca954b1874254b69fa19e2ffce5
  VLCKit:
    url: https://github.com/virtualox/vlckit-spm
    exactVersion: 4.0.0-alpha.21
targets:
  AetherBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/AetherBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_AETHER
    dependencies:
      - package: AetherEngine
  AetherBenchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AetherBenchTests
      - path: Sources/Shared
      - path: Sources/Backends/AetherBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_AETHER
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: AetherEngine
  AVBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/AVPlayerBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_AVPLAYER
  AVBenchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AVBenchTests
      - path: Sources/Shared
      - path: Sources/Backends/AVPlayerBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_AVPLAYER
        GENERATE_INFOPLIST_FILE: YES
  VLCBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/VLCKitBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_VLCKIT
        # VLCKit ships as a binary xcframework, not source, so it has no
        # "Embed Frameworks" phase to lean on the way an app target would.
        # SwiftPM stages VLCKit.framework into the same directory as this
        # tool's own executable (BUILT_PRODUCTS_DIR), but none of the
        # default rpaths point there, so the built binary dyld-fails outside
        # Xcode's own test harness (which has its own framework search
        # paths). @executable_path covers exactly that directory.
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path"]
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
  VLCBenchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VLCBenchTests
      - path: Sources/Shared
      - path: Sources/Backends/VLCKitBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_VLCKIT
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
schemes:
  AetherBench:
    build:
      targets:
        AetherBench: all
        AetherBenchTests: [test]
    test:
      targets:
        - AetherBenchTests
  AVBench:
    build:
      targets:
        AVBench: all
        AVBenchTests: [test]
    test:
      targets:
        - AVBenchTests
  VLCBench:
    build:
      targets:
        VLCBench: all
        VLCBenchTests: [test]
    test:
      targets:
        - VLCBenchTests
