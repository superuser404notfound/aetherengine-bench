name: AetherBench
options:
  bundleIdPrefix: de.superuser404
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    revision: 73354ec8c6d20ca954b1874254b69fa19e2ffce5
  VLCKit:
    url: https://github.com/virtualox/vlckit-spm
    exactVersion: 4.0.0-alpha.21
targets:
  AetherBench:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/AetherBackend.swift
    info:
      path: Sources/Shared/Info.plist
      properties:
        CFBundleDisplayName: AetherBench
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_AETHER
    dependencies:
      - package: AetherEngine
  AVBench:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/AVPlayerBackend.swift
    info:
      path: Sources/Shared/Info.plist
      properties:
        CFBundleDisplayName: AVBench
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_AVPLAYER
  VLCBench:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/VLCKitBackend.swift
    info:
      path: Sources/Shared/Info.plist
      properties:
        CFBundleDisplayName: VLCBench
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_VLCKIT
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
  BenchHarnessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BenchHarnessTests
    dependencies:
      - target: AVBench
schemes:
  AetherBench:
    build:
      targets:
        AetherBench: all
  AVBench:
    build:
      targets:
        AVBench: all
        BenchHarnessTests: [test]
    test:
      targets:
        - BenchHarnessTests
  VLCBench:
    build:
      targets:
        VLCBench: all
