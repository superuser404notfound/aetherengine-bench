name: AetherBench
options:
  bundleIdPrefix: de.superuser404
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    revision: 079d74b9fad2e878afb892a4c771efd7c7ecfd58
  VLCKit:
    url: https://github.com/virtualox/vlckit-spm
    exactVersion: 4.0.0-alpha.21
targets:
  AetherBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/AetherBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_AETHER
        # AetherEngine pulls in FFmpegBuild's frameworks (AetherLibavcodec and
        # the rest since FFmpegBuild 3.x namespaced them), which SwiftPM stages
        # next to this tool (BUILT_PRODUCTS_DIR; older toolchains used
        # BUILT_PRODUCTS_DIR/Frameworks). The default "tool" rpath
        # (@executable_path/../Frameworks) assumes an app-bundle nesting this
        # target does not have, so the built binary dyld-fails outside Xcode's
        # own test harness, the VLCBench target's problem (see its own
        # LD_RUNPATH_SEARCH_PATHS comment) for a different vendored framework
        # set. Both locations are searched.
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path", "@executable_path/Frameworks"]
    dependencies:
      - package: AetherEngine
  AetherBenchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AetherBenchTests
      - path: Sources/Shared
      - path: Sources/Backends/AetherBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_AETHER
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: AetherEngine
  AVBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/AVPlayerBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_AVPLAYER
  AVBenchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AVBenchTests
      - path: Sources/Shared
      - path: Sources/Backends/AVPlayerBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_AVPLAYER
        GENERATE_INFOPLIST_FILE: YES
  VLCBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Backends/VLCKitBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_VLCKIT
        # VLCKit ships as a binary xcframework, not source, so it has no
        # "Embed Frameworks" phase to lean on the way an app target would.
        # SwiftPM stages VLCKit.framework into the same directory as this
        # tool's own executable (BUILT_PRODUCTS_DIR), but none of the
        # default rpaths point there, so the built binary dyld-fails outside
        # Xcode's own test harness (which has its own framework search
        # paths). @executable_path covers exactly that directory.
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path"]
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
  VLCBenchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VLCBenchTests
      - path: Sources/Shared
      - path: Sources/Backends/VLCKitBackend.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BACKEND_VLCKIT
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
schemes:
  AetherBench:
    build:
      targets:
        AetherBench: all
        AetherBenchTests: [test]
    test:
      targets:
        - AetherBenchTests
  AVBench:
    build:
      targets:
        AVBench: all
        AVBenchTests: [test]
    test:
      targets:
        - AVBenchTests
  VLCBench:
    build:
      targets:
        VLCBench: all
        VLCBenchTests: [test]
    test:
      targets:
        - VLCBenchTests
  # The one scheme Scripts/run-bench.sh builds. Xcode 27 removes the frameworks
  # a previous build staged into BUILT_PRODUCTS_DIR when the next scheme builds,
  # so three per-engine builds in a row left only the last engine launchable
  # (AetherBench dyld-failed on AetherLibavcodec, VLCBench on VLCKit). One build
  # of all three tools stages every framework at once.
  AllBench:
    build:
      targets:
        AetherBench: all
        AVBench: all
        VLCBench: all
